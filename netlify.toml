# Netlify Configuration for CosmoFolio Frontend (Next.js)

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NEXT_PUBLIC_API_URL = ""
  NEXT_PUBLIC_FIREBASE_API_KEY = ""
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = ""
  NEXT_PUBLIC_FIREBASE_PROJECT_ID = ""

# Official Netlify Next.js plugin - handles routing, SSR, ISR, etc.
[[plugins]]
  package = "@netlify/plugin-nextjs"
