services:
  - type: web
    name: backend
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        scope: pr
        value: https://rjobifgysmovmcvhdlnd.supabase.co
      - key: SUPABASE_ANON_KEY
        scope: pr
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: pr
        sync: false
      - key: REPLICATE_API_TOKEN
        scope: pr
        sync: false
