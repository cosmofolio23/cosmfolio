version: '3.8'

# Docker Compose Configuration for CosmoFolio
# Phase 7: Task 7.4 - Local development and production deployment

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cosmofolio_postgres
    environment:
      POSTGRES_USER: cosmofolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: cosmofolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmofolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cosmofolio_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cosmofolio_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cosmofolio_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosmofolio_backend
    environment:
      DATABASE_URL: postgresql://cosmofolio:${DB_PASSWORD:-change_me}@postgres:5432/cosmofolio
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_me}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cosmofolio_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js/React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cosmofolio_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - cosmofolio_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx (Optional - Production)
  nginx:
    image: nginx:alpine
    container_name: cosmofolio_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cosmofolio_network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  cosmofolio_network:
    driver: bridge
